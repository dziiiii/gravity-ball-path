<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>重力小球 · 积分减价</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- 顶部 HUD -->
    <header class="hud-top" id="hud-top" hidden>
      <div class="hud-pill">
        <span class="hud-label">距离</span>
        <span class="hud-value"><span id="dist-value">0</span>m</span>
      </div>
      <div class="hud-pill hud-pill-score">
        <span class="hud-label">积分</span>
        <span class="hud-value"><span id="score-value">0</span></span>
      </div>
    </header>

    <!-- 操作提示 -->
    <div class="tilt-hint" id="tilt-hint" hidden>
      <div class="tilt-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="40" height="40">
          <rect x="14" y="6" width="20" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="24" cy="36" r="1.6" fill="currentColor"/>
          <path d="M8 18 L14 18 M8 18 L11 15 M8 18 L11 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M40 30 L34 30 M40 30 L37 27 M40 30 L37 33" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <p>倾斜手机，控制小球</p>
    </div>

    <!-- 底部减价条 -->
    <footer class="hud-bottom" id="hud-bottom" hidden>
      <div class="discount-bar">
        <span class="discount-main">已集 <strong id="discount-score">0</strong> 分 · 可减 <strong>¥<span id="discount-yuan">0</span></strong></span>
      </div>
      <p class="discount-rule">1积分 = 减1元</p>
    </footer>

    <!-- 开始界面 -->
    <div class="overlay" id="start-overlay">
      <div class="panel">
        <h1>重力小球</h1>
        <p class="tagline">倾斜手机 · 绕开坑洞 · 吃积分减价</p>
        <ul class="rules">
          <li>手机放平，轻轻倾斜控制方向</li>
          <li>掉进黑洞即失败</li>
          <li>吃到的积分可直接抵扣：1 分 = 减 1 元</li>
        </ul>
        <button class="btn-primary" id="btn-start" type="button">开始游戏</button>
        <p class="desktop-tip">电脑上可用方向键 / WASD 操作</p>
      </div>
    </div>

    <!-- 结算界面 -->
    <div class="overlay" id="over-overlay" hidden>
      <div class="panel">
        <h2 id="over-title">游戏结束</h2>
        <div class="result-grid">
          <div class="result-item">
            <span class="result-label">前进距离</span>
            <span class="result-value"><span id="over-dist">0</span>m</span>
          </div>
          <div class="result-item">
            <span class="result-label">获得积分</span>
            <span class="result-value"><span id="over-score">0</span></span>
          </div>
          <div class="result-item result-item-accent">
            <span class="result-label">可减金额</span>
            <span class="result-value">¥<span id="over-discount">0</span></span>
          </div>
        </div>
        <p class="result-rule">1积分 = 减1元</p>
        <button class="btn-primary" id="btn-restart" type="button">再来一局</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
